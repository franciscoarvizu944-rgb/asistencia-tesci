<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - TESCI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        .header { background: #3f51b5; color: white; padding: 30px; border-radius: 0 0 30px 30px; }
        #reader { width: 100%; border-radius: 15px; overflow: hidden; margin-top: 20px; }
    </style>
</head>
<body class="bg-light">
    <div class="header text-center">
        <h2 id="userTitle">¡Hola!</h2>
        <p>Escanea el QR del profesor</p>
    </div>
    <div class="container text-center">
        <div id="reader"></div>
        <div id="msg" class="mt-3 fw-bold"></div>
        <button class="btn btn-link text-danger mt-5" onclick="logout()">Cerrar Sesión</button>
    </div>

    <script>
        document.getElementById('userTitle').innerText = "¡Hola, " + (localStorage.getItem('nombre_alumno') || "Alumno") + "!";
        
        const scanner = new Html5Qrcode("reader");
        scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (text) => {
            scanner.stop();
            registrarAsistencia(text);
        });

        async function registrarAsistencia(codigo) {
            const fd = new FormData();
            fd.append('alumno_nombre', localStorage.getItem('nombre_alumno'));
            fd.append('codigo_qr', codigo);
            try {
                const res = await fetch('http://asistencia-escolar-2026.infinityfreeapp.com/api/registrar_asistencia.php', { method: 'POST', body: fd });
                const data = await res.json();
                alert(data.status === 'ok' ? "Asistencia Registrada" : "Error: " + data.message);
                location.reload();
            } catch (e) { alert("Error de red"); }
        }

        function logout() { localStorage.clear(); window.location.href = 'index.html'; }
    </script>
</body>
</html>
