<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TESCI Alumnos</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f0f2f5; font-family: sans-serif; }
        .app-card { max-width: 400px; margin: 40px auto; padding: 30px; background: white; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .btn-tesci { background-color: #3f51b5; color: white; border-radius: 12px; padding: 12px; font-weight: bold; width: 100%; border: none; }
        .btn-tesci:hover { background-color: #303f9f; }
        .form-control { border-radius: 12px; padding: 12px; margin-bottom: 15px; }
        .text-indigo { color: #3f51b5; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="app-card text-center">
        <h3 class="mb-4" style="color: #3f51b5;">Asistencia TESCI</h3>
        
        <div id="loginForm">
            <input type="email" id="email" class="form-control" placeholder="Correo Institucional">
            <input type="password" id="password" class="form-control" placeholder="Contraseña">
            <button class="btn-tesci mb-3" onclick="login()">Entrar</button>
            <p class="text-muted">¿Nuevo aquí? <span class="text-indigo" onclick="toggleForm()">Regístrate</span></p>
        </div>

        <div id="registerForm" style="display:none;">
            <input type="text" id="regNombre" class="form-control" placeholder="Nombre(s)">
            <input type="text" id="regApellidos" class="form-control" placeholder="Apellidos">
            <input type="text" id="regControl" class="form-control" placeholder="Número de Control">
            <input type="email" id="regEmail" class="form-control" placeholder="Correo @cuautitlan.tecnm.mx">
            <input type="password" id="regPassword" class="form-control" placeholder="Contraseña">
            <button class="btn btn-success w-100 p-2 mb-3" style="border-radius:12px;" onclick="registrar()">Crear Cuenta</button>
            <p class="text-muted" onclick="toggleForm()" style="cursor:pointer;">Volver al Inicio</p>
        </div>
        
        <div id="mensaje" class="mt-3 text-danger fw-bold small"></div>
    </div>

    <script>
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }

        function toggleForm() {
            const login = document.getElementById('loginForm');
            const register = document.getElementById('registerForm');
            login.style.display = login.style.display === 'none' ? 'block' : 'none';
            register.style.display = register.style.display === 'none' ? 'block' : 'none';
        }

        // URL CORREGIDA: Apuntando a la raíz de Render donde están tus archivos
        const API_URL = 'https://asistencia-tesci.onrender.com/';

        async function login() {
            const fd = new FormData();
            fd.append('email', document.getElementById('email').value);
            fd.append('password', document.getElementById('password').value);

            try {
                const res = await fetch(API_URL + 'login_alumno.php', { method: 'POST', body: fd });
                const data = await res.json();
                if(data.status === 'ok') {
                    localStorage.setItem('nombre_alumno', data.user.nombre);
                    window.location.href = 'home.html';
                } else {
                    document.getElementById('mensaje').innerText = data.message;
                }
            } catch (e) {
                document.getElementById('mensaje').innerText = "Error de conexión con el servidor.";
            }
        }

        async function registrar() {
            const fd = new FormData();
            fd.append('nombre', document.getElementById('regNombre').value);
            fd.append('apellidos', document.getElementById('regApellidos').value);
            fd.append('numero_control', document.getElementById('regControl').value);
            fd.append('email', document.getElementById('regEmail').value);
            fd.append('password', document.getElementById('regPassword').value);

            try {
                const res = await fetch(API_URL + 'registro_alumno.php', { method: 'POST', body: fd });
                const data = await res.json();
                if(data.status === 'ok') {
                    alert("¡Registro exitoso! Ahora inicia sesión.");
                    toggleForm();
                } else {
                    document.getElementById('mensaje').innerText = data.message;
                }
            } catch (e) {
                document.getElementById('mensaje').innerText = "Error al conectar con la base de datos.";
            }
        }
    </script>
</body>
</html>
